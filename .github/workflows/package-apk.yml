name: Package & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Deterministic Keystore
        run: |
          echo "Restoring unified deterministic signing keystore..."
          echo "" | base64 -d > debug.keystore

      - name: Grant Execute Permissions
        run: chmod +x gradlew || true

      - name: Compute Semantic Version
        id: versioning
        run: |
          RUN_NUM=${GITHUB_RUN_NUMBER:-12}
          MAJOR=$(( 1 + (RUN_NUM / 100) ))
          MINOR=$(( (RUN_NUM / 10) % 10 ))
          PATCH=$(( RUN_NUM % 10 ))
          TAG="v$MAJOR.$MINOR.$PATCH"
          echo "computed_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Semantic Version computed: $TAG"

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug & Release APK
        run: gradle :app:assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/CyberMaze-3D.apk
          ls -lh release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.computed_tag }}
          name: "CyberMaze 3D ${{ steps.versioning.outputs.computed_tag }}"
          body: |
            ### 🚀 CyberMaze 3D Release ${{ steps.versioning.outputs.computed_tag }}
            
            #### Highlights:
            - **In-App Auto Update**: Download and upgrade smoothly right from the application.
            - **3D Motion-Synthesized Levels**: Map generation powered by mobile sensor movement (elevation + depression + steps).
            - **Bring Your Own Key (BYOK)**: Multi-provider support for Groq, OpenRouter, OpenAI, and Google Gemini with custom models.
            - **Dynamic AI-Driven Enemy Tactics**: Intelligent drones that coordinate real-time pursuit.
            - **SQLite Room Offline Database**: Complete local persistence for movement logs, level maps, and configurations.
            
            Built deterministically with unified cryptographic keystore.
          files: release_assets/CyberMaze-3D.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
